; Waveshare ESP32-S3-RLCD-4.2 — Hardware-Bring-up
; Modul: ESP32-S3-WROOM-1-N16R8 (16 MB Flash, 8 MB Octal-PSRAM)
;
; Plattform ist bewusst auf 6.13.0 gepinnt: die liefert ESP-IDF 5.5.3 und damit
; dieselbe Minor-Serie, gegen die Waveshare seine Beispiele baut (5.5.1).
; espressif32@7.x waere IDF 6.1 — dort sind diverse APIs entfernt, die der
; uebernommene Display-Treiber noch benutzt.

[env:rlcd42]
platform  = espressif32@6.13.0
framework = espidf
board     = esp32-s3-devkitc-1

board_upload.flash_size = 16MB
board_build.flash_mode  = qio
board_build.partitions  = partitions.csv

; Doppelt mit EMBED_FILES in src/CMakeLists.txt: PlatformIO erzeugt die
; Assemblerdatei fuer das Einbetten nur, wenn die Datei auch hier steht.
board_build.embed_files =
    assets/wach.film
    assets/zu.film
    assets/karte/pilz.bin
    assets/karte/boden.bin
    assets/karte/objekte.bin

; COM6 = nativer USB-Serial/JTAG des ESP32-S3 (VID 303A / PID 1001)
upload_port   = COM6
monitor_port  = COM6
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
